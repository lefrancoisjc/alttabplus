name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version $version"

      - name: Build
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Publish self-contained
        shell: pwsh
        run: ./scripts/publish-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Publish framework-dependent
        shell: pwsh
        run: ./scripts/publish-release.ps1 -Version "${{ steps.version.outputs.value }}" -Mode framework-dependent

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: AltTabPlus-${{ steps.version.outputs.value }}-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: AltTabPlus-*-win-x64
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
